; PHP settings for production.

; The source is baked into the image and cannot change under a running
; container, so there is nothing to revalidate. This is the single largest
; difference in throughput between the two targets.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 20000

; Never to a response. An exception reaches a client as JSON, shaped by
; Laravel's handler, carrying no file paths and no stack.
display_errors = Off
log_errors = On
error_log = /dev/stderr

; Announces the exact PHP version in a header. Nothing reads it but somebody
; matching a CVE to this deployment.
expose_php = Off

upload_max_filesize = 16M
post_max_size = 18M
memory_limit = 256M

realpath_cache_size = 4096K
realpath_cache_ttl = 600
