; PHP settings for local development.
;
; The source tree is bind-mounted, so opcache has to notice an edit. Checking
; on every request is the whole point here and costs a stat call.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Errors reach the developer as JSON, rendered by Laravel's exception handler,
; which is the same path a client takes. Letting PHP print its own output as
; well would corrupt that JSON with a stack trace nothing can parse.
display_errors = Off
log_errors = On
error_log = /dev/stderr

; Function arguments stay out of exception traces here too, as in production,
; so the test that says a seller's details never reach one runs against what
; production does rather than against a laxer setting (ADR 0031).
zend.exception_ignore_args = On

; Product images are the reason. Generous locally so an upload fails against a
; real limit in staging rather than against this one.
upload_max_filesize = 32M
post_max_size = 34M
memory_limit = 512M
