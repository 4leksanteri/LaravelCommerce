# Production stack.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# A separate file rather than an overlay on docker-compose.yml. An overlay
# inherits what it does not override, and what it would inherit is a set of
# bind mounts pointing at somebody's working tree. The duplication between the
# two files is the price of not being able to make that mistake.
#
# What is different here, and why:
#
#   * The API publishes no port. It is reachable from the web container and
#     from nothing else. This is the architecture, not a hardening step.
#   * No source is mounted. Both images carry their own build output.
#   * Migrations do not run on boot - `make deploy-migrate` runs them once,
#     before the new containers take traffic.
#   * Secure cookies and debug off are not defaults to be overridden. They are
#     stated here, because getting either wrong in production is a real
#     incident.
#
# TLS terminates in front of this stack - a load balancer, or a reverse proxy
# on the host. The web container speaks plain HTTP on 3000 and reads the
# X-Forwarded-Proto that proxy sets.

name: laravel-commerce-prod

x-api-environment: &api-environment
  APP_NAME: ${APP_NAME}
  APP_ENV: production
  APP_KEY: ${APP_KEY:?APP_KEY must be set}
  APP_DEBUG: "false"
  APP_URL: ${APP_URL:?APP_URL must be set}
  FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL must be set}

  # The public origin of the web application, and nothing else. A wildcard
  # here would let any site hold a session against this API.
  SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:?SANCTUM_STATEFUL_DOMAINS must be set}

  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: ${DB_DATABASE:?DB_DATABASE must be set}
  DB_USERNAME: ${DB_USERNAME:?DB_USERNAME must be set}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}

  SESSION_DRIVER: database
  SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
  SESSION_DOMAIN: ${SESSION_DOMAIN:-null}
  # The site is HTTPS, so the session cookie is refused over plain HTTP.
  SESSION_SECURE_COOKIE: "true"

  CACHE_STORE: database
  QUEUE_CONNECTION: database

  # A real provider. There is no Mailpit here, and `log` is not an acceptable
  # production value: password reset and email verification are the only way
  # somebody recovers an account, so mail that goes nowhere is an outage that
  # looks like everything working.
  MAIL_MAILER: ${MAIL_MAILER:?MAIL_MAILER must be set}
  MAIL_HOST: ${MAIL_HOST:?MAIL_HOST must be set}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME}
  MAIL_PASSWORD: ${MAIL_PASSWORD}
  MAIL_SCHEME: ${MAIL_SCHEME:-tls}

  # How long a pending order waits before `orders:expire` cancels it and
  # returns its stock.
  #
  # Defaulted rather than required, because an unset value is not an outage -
  # it is three days instead of whatever was intended. **Nothing in this file
  # runs the command**: it needs an external trigger, and ADR 0013 says what
  # that will be.
  ORDER_PENDING_EXPIRES_AFTER_HOURS: ${ORDER_PENDING_EXPIRES_AFTER_HOURS:-72}
  ORDER_AUTO_COMPLETE_AFTER_DAYS: ${ORDER_AUTO_COMPLETE_AFTER_DAYS:-14}

  # Stripe Connect. Required rather than defaulted: a production stack that
  # starts without them is a marketplace that cannot take money and will not
  # say so until somebody tries to buy something.
  #
  # These are still test keys. This project is never deployed (ADR 0015), and
  # the requirement is here so the shape is right rather than because a live
  # key is expected.
  STRIPE_SECRET: ${STRIPE_SECRET:?STRIPE_SECRET must be set}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?STRIPE_WEBHOOK_SECRET must be set}
  STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:?STRIPE_PUBLISHABLE_KEY must be set}
  STRIPE_PLATFORM_COUNTRY: ${STRIPE_PLATFORM_COUNTRY:-FI}
  STRIPE_PLATFORM_FEE_BPS: ${STRIPE_PLATFORM_FEE_BPS:-500}
  ORDER_UNPAID_EXPIRES_AFTER_MINUTES: ${ORDER_UNPAID_EXPIRES_AFTER_MINUTES:-30}

  # Which disk new product images are written to. Defaulted to the local one,
  # which is wrong for more than one replica - a container's disk is its own,
  # so an image uploaded to one is a 404 on the next. That is the change object
  # storage makes, and until then this stack is single-replica by implication.
  PRODUCT_IMAGE_DISK: ${PRODUCT_IMAGE_DISK:-products}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:?MAIL_FROM_ADDRESS must be set}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME}

  # Pinned rather than taken from the environment, as the other decisions here
  # are. A deployment that writes its log to a file inside a container has a
  # log nobody reads and a disk that fills (ADR 0044).
  LOG_CHANNEL: stderr
  LOG_STACK: stderr
  LOG_STDERR_FORMATTER: 'App\Logging\CloudLoggingFormatter'
  LOG_LEVEL: ${LOG_LEVEL:-warning}

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE must be set}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME must be set}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      # /var/lib/postgresql, not /var/lib/postgresql/data - see the comment in
      # docker-compose.yml. Postgres 18 refuses to start otherwise.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      target: production
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment: *api-environment
    # No `ports`. Deliberate, and the single most important line in this file:
    # the API is reachable on the internal network by the web container, and
    # is not published to the internet. See ADR 0003.
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8000/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Sends every notification (ADR 0035): the API's image running a worker
  # instead of a web server. No ports, like the api. The production entrypoint
  # still runs first, so the worker refuses to start without APP_KEY and works
  # from cached configuration. `--max-time` recycles it every hour, so a slow
  # leak is a restart rather than an outage.
  queue:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      target: production
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment: *api-environment
    command: ["php", "artisan", "queue:work", "--tries=3", "--backoff=60", "--max-time=3600"]

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      target: production
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
    ports:
      # The only thing published. Bind to the loopback interface if a reverse
      # proxy terminating TLS is running on the same host.
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      # /healthz, not /. It answers whether this process is serving and
      # nothing else - it does not render a page and does not call the API.
      # See the route's own comment for why probing / was wrong.
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  postgres_data:
